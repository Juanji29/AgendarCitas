<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
    <h1>HealthBook</h1>
    <h1>Crear cuenta</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrarse</button>
    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'usuarios:login' %}">Inicia sesión</a>
    </p>
</body>
</html>
