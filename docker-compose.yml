services:
  # --- Message Broker (Redis) para tareas asíncronas con Celery ---
  redis:
    image: redis:7-alpine
    container_name: healthbook_redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Monolito legacy (Django) ---
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthbook_django
    # Aplica migraciones (crea la BD y siembra datos) antes de iniciar gunicorn.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 AgendarCitasMedicas.wsgi:application"
    volumes:
      - django_data:/app/data
    environment:
      # En el servidor, agrega la IP pública en un archivo .env:
      #   DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,django,nginx,<IP-publica>
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django,nginx}
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - USAR_MICROSERVICIO_NOTIFICACIONES=True
      - NOTIFICACIONES_SERVICE_URL=http://nginx
      - NOTIFICACIONES_SERVICE_TIMEOUT=5
      # Integraciones externas (Patrón Adapter)
      - FESTIVOS_API_URL=https://date.nager.at
      - FESTIVOS_API_PAIS=CO
      # Microservicio de catálogo vía Nginx (plan B: tabla local)
      - CATALOGO_SERVICE_URL=http://nginx
      # Servicio del equipo aliado (configurar su URL en el despliegue)
      - ALIADO_SERVICE_URL=
      # Message Broker (Celery + Redis)
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    expose:
      - "8000"
    depends_on:
      - notificaciones
      - catalogo
      - redis

  # --- Worker de Celery (procesa tareas de fondo del monolito) ---
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthbook_celery
    command: celery -A AgendarCitasMedicas worker --loglevel=info
    # Comparte la BD con Django para poder leer las citas que debe notificar.
    volumes:
      - django_data:/app/data
    environment:
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - USAR_MICROSERVICIO_NOTIFICACIONES=True
      - NOTIFICACIONES_SERVICE_URL=http://nginx
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - notificaciones
      - django

  # --- Microservicio estrangulado: Notificaciones (Flask) ---
  notificaciones:
    build:
      context: ./notificaciones_service
      dockerfile: Dockerfile
    container_name: healthbook_notificaciones
    environment:
      # Sin SMTP configurado, el servicio degrada a modo consola (logs).
      - FROM_EMAIL=no-reply@healthbook.local
    expose:
      - "5000"

  # --- Microservicio estrangulado: Catálogo (Flask + DB propia) ---
  catalogo:
    build:
      context: ./catalogo_service
      dockerfile: Dockerfile
    container_name: healthbook_catalogo
    environment:
      - CATALOGO_DB_PATH=/app/catalogo.sqlite3
    expose:
      - "5000"

  # --- Orquestador de tráfico (Nginx como API Gateway) ---
  nginx:
    image: nginx:1.27-alpine
    container_name: healthbook_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django
      - notificaciones
      - catalogo

volumes:
  django_data:
