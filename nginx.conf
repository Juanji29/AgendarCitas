# nginx.conf - Orquestación de tráfico (Strangler Pattern)
# Bifurca el tráfico por URL entre el monolito Django y el microservicio Flask.

upstream django_web {
    server django:8000;
}

upstream flask_notificaciones {
    server notificaciones:5000;
}

server {
    listen 80;
    server_name localhost;

    # --- Ruta ESTRANGULADA -> Microservicio Flask ---
    # La funcionalidad de notificaciones se sirve desde el nuevo microservicio.
    location /api/v2/notificaciones/ {
        proxy_pass http://flask_notificaciones;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck del microservicio expuesto a través de Nginx.
    location /api/v2/notificaciones/health {
        proxy_pass http://flask_notificaciones/health;
    }

    # --- Rutas LEGACY (/api/v1/ y todo el monolito) -> Django ---
    location /api/v1/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del monolito (citas, usuarios, admin, estáticos...).
    location / {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
